services:
  - type: web
    name: ai-brain-god-v2
    env: python
    region: frankfurt
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.render.txt
    startCommand: python -m app.main
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_HOST
        value: 0.0.0.0
      - key: APP_PORT
        value: 10000
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: AUTONOMY_LEVEL
        value: 2
      - key: SECRET_KEY
        generateValue: true
      - key: DISABLE_SCHEDULER
        value: false
      - key: DISABLE_PROVIDER_HEALTH
        value: false
      - key: DISABLE_TOOLS_HEALTH
        value: false
    disk:
      name: ai-brain-data-v2
      mountPath: /opt/render/project/src/data
      sizeGB: 1
