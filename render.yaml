services:
  - type: web
    name: ai-brain-god
    env: python
    region: frankfurt
    plan: starter
    branch: main
    buildCommand: pip install -r requirements.render.txt
    startCommand: python -m app.main
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_HOST
        value: 0.0.0.0
      - key: APP_PORT
        value: 10000
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: AUTONOMY_LEVEL
        value: 2
      - key: DISABLE_SCHEDULER
        value: true
      - key: SECRET_KEY
        generateValue: true
