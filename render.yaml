services:
  - type: web
    name: ai-brain-god
    env: python
    region: frankfurt
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: pip install fastapi uvicorn
    startCommand: uvicorn app.main_minimal:app --host 0.0.0.0 --port 10000
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
